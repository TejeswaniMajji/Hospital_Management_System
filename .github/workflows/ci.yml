name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: hospital-management-system-main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: hospital-management-system-main/pom.xml

      - name: Build and run tests (H2 profile)
        run: mvn -B -ntp package

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hospital-management-system:ci .

      - name: Run container and smoke-test it
        run: |
          docker run -d --name smoke -p 8080:8080 hospital-management-system:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/hospital/auth/login > /dev/null; then
              echo "Container is serving traffic"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8080/hospital/auth/login > /dev/null || (docker logs smoke && exit 1)
          docker stop smoke
          docker rm smoke

  mysql-integration:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: hospital_db
          MYSQL_USER: hospital_user
          MYSQL_PASSWORD: hospital_pass
          MYSQL_ROOT_PASSWORD: root_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: hospital-management-system-main/pom.xml

      - name: Build jar
        run: mvn -B -ntp package -DskipTests

      - name: Boot app against real MySQL, confirm Flyway migrates and the app responds
        env:
          SPRING_PROFILES_ACTIVE: mysql
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/hospital_db
          SPRING_DATASOURCE_USERNAME: hospital_user
          SPRING_DATASOURCE_PASSWORD: hospital_pass
        run: |
          java -jar target/*.jar &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/hospital/auth/login > /dev/null; then
              echo "App is up and serving traffic against real MySQL"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8080/hospital/auth/login > /dev/null || exit 1
          kill $APP_PID
