spring.application.name=Hospital Management System

# Server Configuration
# Cloud Run requires listening on the PORT env var
server.port=${PORT:8080}
server.servlet.context-path=/hospital

# --- DATABASE CONFIGURATION ---
# H2 in-memory database for local dev. Override via env vars for MySQL/RDS deployments,
# e.g. SPRING_DATASOURCE_URL=jdbc:mysql://<host>:3306/hospital_db
spring.datasource.url=jdbc:h2:mem:hospital_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- FLYWAY CONFIGURATION ---
# Owns schema creation/evolution via versioned scripts in db/migration
spring.flyway.enabled=true

# --- JPA/HIBERNATE CONFIGURATION ---
# Flyway owns the schema now; Hibernate only validates entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- THYMELEAF & LOGGING (Your existing settings are fine) ---
spring.thymeleaf.cache=false
logging.level.com.hospital=DEBUG

# --- JWT CONFIGURATION (stateless auth for REST API clients only; web pages keep using sessions) ---
# In production, set the JWT_SECRET env var instead of committing a real secret here.
jwt.secret=${JWT_SECRET:change-this-dev-only-secret-key-must-be-at-least-32-bytes-long}
jwt.expiration-ms=3600000